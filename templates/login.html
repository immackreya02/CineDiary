<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In & Register — CineDiary</title>
  <style>
    :root {
      --bg: #140A0D;
      --card: #1F0E15;
      --border: #3A2029;
      --gold: #D4A94C;
      --text: #F3E9DC;
      --muted: #B39A9E;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
    }

    .navbar {
      background: #190B10;
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-family: Georgia, serif;
      font-size: 1.5rem;
      color: var(--gold);
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 440px;
      margin: 4rem auto;
      padding: 2rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 0.8rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      box-sizing: border-box;
    }

    input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .btn {
      width: 100%;
      background: var(--gold);
      color: #140A0D;
      border: none;
      padding: 0.85rem;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 1rem;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: #c2983e;
    }

    .error-box {
      background: #3B151E;
      border: 1px solid #8B1E3F;
      color: #F87171;
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1.25rem;
      text-align: center;
      font-size: 0.9rem;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }

    .tab-btn {
      flex: 1;
      text-align: center;
      padding: 0.75rem;
      cursor: pointer;
      color: var(--muted);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
      font-weight: bold;
    }
  </style>
  <script>
    function showTab(tab) {
      const loginTab = document.getElementById('tab-login');
      const signupTab = document.getElementById('tab-signup');
      const loginForm = document.getElementById('form-login');
      const signupForm = document.getElementById('form-signup');

      if (!loginTab || !signupTab || !loginForm || !signupForm) return;

      if (tab === 'signup') {
        signupTab.classList.add('active');
        loginTab.classList.remove('active');
        signupForm.style.display = 'block';
        loginForm.style.display = 'none';
      } else {
        loginTab.classList.add('active');
        signupTab.classList.remove('active');
        loginForm.style.display = 'block';
        signupForm.style.display = 'none';
      }
    }
  </script>
</head>

<body>
  <div class="navbar">
    <a href="/" class="brand">🎬 CineDiary</a>
  </div>

  <div class="container">
    <!-- Tabs Header -->
    <div class="tabs">
      <button id="tab-login" type="button" class="tab-btn {% if active_tab != 'signup' %}active{% endif %}"
        onclick="showTab('login')">
        Sign In
      </button>
      <button id="tab-signup" type="button" class="tab-btn {% if active_tab == 'signup' %}active{% endif %}"
        onclick="showTab('signup')">
        Create Account
      </button>
    </div>

    <!-- Error Alert Box -->
    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <!-- Sign In Form -->
    <form id="form-login" action="/login" method="POST"
      style="display: {% if active_tab == 'signup' %}none{% else %}block{% endif %};">
      <input type="hidden" name="action" value="login">
      <div class="form-group">
        <label for="login-email">Email Address</label>
        <input type="email" id="login-email" name="email" required placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" required placeholder="••••••••"
          autocomplete="current-password">
      </div>
      <button type="submit" class="btn">Sign In to CineDiary</button>
    </form>

    <!-- Create Account Form -->
    <form id="form-signup" action="/login" method="POST"
      style="display: {% if active_tab == 'signup' %}block{% else %}none{% endif %};">
      <input type="hidden" name="action" value="register">
      <div class="form-group">
        <label for="reg-name">Full Name</label>
        <input type="text" id="reg-name" name="name" required placeholder="Reya" autocomplete="name">
      </div>
      <div class="form-group">
        <label for="reg-email">Email Address</label>
        <input type="email" id="reg-email" name="email" required placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" name="password" required placeholder="At least 6 characters"
          autocomplete="new-password">
      </div>
      <button type="submit" class="btn">Create Account & Send OTP</button>
    </form>
  </div>
</body>

</html>
