<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verify Email OTP — CineDiary</title>
  <style>
    :root { --bg: #140A0D; --card: #1F0E15; --border: #3A2029; --gold: #D4A94C; --text: #F3E9DC; --muted: #B39A9E; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
    .navbar { background: #190B10; border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; }
    .brand { font-family: Georgia, serif; font-size: 1.5rem; color: var(--gold); text-decoration: none; font-weight: bold; }
    .container { max-width: 440px; margin: 4rem auto; padding: 2rem; background: var(--card); border: 1px solid var(--border); border-radius: 16px; text-align: center; }
    .otp-input { letter-spacing: 12px; font-size: 1.8rem; text-align: center; padding: 0.8rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--gold); font-weight: bold; width: 100%; box-sizing: border-box; }
    .btn { width: 100%; background: var(--gold); color: #140A0D; border: none; padding: 0.8rem; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 1rem; }
    .error-box { background: #3B151E; border: 1px solid #8B1E3F; color: #F87171; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/" class="brand">🎬 CineDiary</a>
  </div>

  <div class="container">
    <h2 style="font-family: Georgia, serif; color: var(--gold);">Verify Your Email</h2>
    <p style="color: var(--muted); font-size: 0.9rem;">Enter the 6-digit verification code sent to <strong>{{ email }}</strong></p>

    {% if error %}
      <div class="error-box">{{ error }}</div>
    {% endif %}

    <form action="/verify-otp" method="POST">
      <input type="hidden" name="email" value="{{ email }}">
      <div style="margin: 1.5rem 0;">
        <input type="text" name="otp" maxlength="6" class="otp-input" placeholder="123456" required autofocus>
      </div>
      <button type="submit" class="btn">Verify Account</button>
    </form>
  </div>
</body>
</html>
